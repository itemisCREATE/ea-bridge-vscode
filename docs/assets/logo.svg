<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Diagonaler Verlauf: oben-links hell -> unten-rechts dunkel -->
    <linearGradient id="blueGrad" gradientUnits="userSpaceOnUse"
                    x1="20" y1="20" x2="236" y2="236">
      <stop offset="0" stop-color="#00AFFF"/>
      <stop offset="1" stop-color="#006ECD"/>
    </linearGradient>
  </defs>

  <!-- Oberer Balken: obere Kurve, rechte Linie, untere Kurve, linke Linie -->
  <path d="M 9 41
           Q 127.5 8 246 43
           L 246 89
           Q 127.5 59 9 89
           Z"
        fill="url(#blueGrad)"/>

  <!-- Linker unterer Balken: schraege Oberkante (innen hoeher), 4 Linien -->
  <path d="M 56 100
           L 98 95
           L 98 230
           L 56 230
           Z"
        fill="url(#blueGrad)"/>

  <!-- Rechter unterer Balken: schraege Oberkante (innen hoeher), 4 Linien -->
  <path d="M 157 95
           L 199 101
           L 199 230
           L 157 230
           Z"
        fill="url(#blueGrad)"/>
</svg>